packages:
  - "apps/*"
  - "packages/*"
# Do not add dangerouslyAllowAllBuilds here. pnpm 10 maps it to
# neverBuiltDependencies and allowBuilds to onlyBuiltDependencies; both set
# is ERR_PNPM_CONFIG_CONFLICT_BUILT_DEPENDENCIES and breaks Docker install.
allowBuilds:
  "@google/genai": true
  argon2: true
  better-sqlite3: true
  es5-ext: true
  esbuild: true
  msw: true
  protobufjs: true
  # Install scripts download from GitHub (Chrome / libvips) and time out on
  # production hosts. Runtime never loads sharp; puppeteer is e2e-only.
  puppeteer: false
  sharp: false
allowedDeprecatedVersions:
  "@esbuild-kit/core-utils": "*"
  "@esbuild-kit/esm-loader": "*"
  "node-domexception": "*"
  "prebuild-install": "*"
